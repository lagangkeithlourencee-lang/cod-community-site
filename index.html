<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TF141 — Task Force 141 // CODM Tactical Terminal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #070907;
      --panel: #0d120a;
      --panel-hover: #131a0e;
      --line: #1f2a18;
      --bone: #f0f2eb;
      --muted: #7a856f;
      --olive: #4a5c34;
      --olive-glow: rgba(74, 92, 52, 0.4);
      --blaze: #ff5c1f;
      --blaze-glow: rgba(255, 92, 31, 0.25);
      --ok: #8fae5c;
    }

    body {
      background: radial-gradient(circle at 50% 0%, rgba(255, 92, 31, 0.08) 0%, transparent 50%), var(--bg);
      color: var(--bone);
      font-family: 'Inter', sans-serif;
    }

    .font-display {
      font-family: 'Oswald', sans-serif;
      letter-spacing: 0.04em;
    }

    .font-mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    /* Animated HUD Overlay */
    .hud-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: 
        linear-gradient(rgba(74, 92, 52, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 92, 52, 0.08) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse 90% 80% at 50% 20%, black, transparent 85%);
    }

    /* Reticle Frames */
    .bracket {
      position: relative;
    }
    .bracket::before, .bracket::after, .bracket > .bl::before, .bracket > .br::before {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      z-index: 2;
      border-color: var(--blaze);
      opacity: 0.7;
      transition: all 0.2s ease;
    }
    .bracket::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    .bracket::after { top: -1px; right: -1px; border-top: 2px solid; border-right: 2px solid; }
    .bracket > .bl::before { bottom: -1px; left: -1px; border-bottom: 2px solid; border-left: 2px solid; }
    .bracket > .br::before { bottom: -1px; right: -1px; border-bottom: 2px solid; border-right: 2px solid; }
  </style>
</head>
<body class="min-h-screen relative flex flex-col justify-between">

  <div class="hud-grid"></div>

  <!-- Header Section -->
  <header class="relative z-10 border-b border-[var(--line)] bg-[var(--bg)]/80 backdrop-blur">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 bg-[var(--blaze)] animate-pulse"></div>
        <h1 class="font-display text-2xl tracking-wider text-[var(--bone)]">TASK FORCE 141</h1>
      </div>
      <nav class="flex gap-6 font-mono text-sm text-[var(--muted)]">
        <a href="#loadouts" class="hover:text-[var(--blaze)] transition-colors">/META_GUNSMITH</a>
        <a href="#schedule" class="hover:text-[var(--blaze)] transition-colors">/MATCH_SCHEDULE</a>
        <a href="#recruitment" class="hover:text-[var(--blaze)] transition-colors">/RECRUITMENT</a>
      </nav>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <main class="relative z-10 max-w-7xl mx-auto px-6 py-10 grid grid-cols-1 md:grid-cols-3 gap-8">
    
    <!-- Left/Center: Leaderboards & Meta Gunsmith -->
    <section id="loadouts" class="md:col-span-2 space-y-6">
      <div class="flex items-center justify-between border-b border-[var(--line)] pb-2">
        <h2 class="font-display text-xl text-[var(--bone)]">COMMUNITY META LOADOUTS</h2>
        <span class="text-xs font-mono text-[var(--muted)]">SOURCE: CLOUDFLARE D1</span>
      </div>
      
      <div id="loadouts-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="p-4 bg-[var(--panel)] border border-[var(--line)] text-xs font-mono text-[var(--muted)]">
          INITIALIZING D1 DATA FEED...
        </div>
      </div>
    </section>

    <!-- Right Sidebar: Match Schedule & Recruitment Form -->
    <section class="space-y-8">
      
      <!-- Match Schedule -->
      <div id="schedule" class="space-y-4">
        <div class="border-b border-[var(--line)] pb-2">
          <h2 class="font-display text-xl text-[var(--bone)]">UPCOMING SCRIMS</h2>
          <span class="text-xs font-mono text-[var(--muted)]">AUTO-CONVERTED TO LOCAL TIME</span>
        </div>
        <div id="schedule-container" class="bg-[var(--panel)] border border-[var(--line)] divide-y divide-[var(--line)]">
          <div class="p-3 text-xs font-mono text-[var(--muted)]">FETCHING MATCH SCHEDULE...</div>
        </div>
      </div>

      <!-- Turnstile Verified Application Form -->
      <div id="recruitment" class="p-6 bg-[var(--panel)] border border-[var(--line)] bracket space-y-4">
        <div class="bl"></div><div class="br"></div>
        <h3 class="font-display text-lg text-[var(--blaze)]">ENLISTMENT APPLICATION</h3>
        
        <form action="https://your-worker.your-subdomain.workers.dev/api/apply" method="POST" class="space-y-4 text-sm">
          <div>
            <label class="block font-mono text-xs text-[var(--muted)] mb-1">OPERATOR ID / IGN</label>
            <input type="text" name="username" required class="w-full bg-[var(--bg)] border border-[var(--line)] p-2 text-[var(--bone)] focus:border-[var(--blaze)] outline-none">
          </div>
          
          <div>
            <label class="block font-mono text-xs text-[var(--muted)] mb-1">PRIMARY ROLE</label>
            <select name="role" class="w-full bg-[var(--bg)] border border-[var(--line)] p-2 text-[var(--bone)] focus:border-[var(--blaze)] outline-none">
              <option value="assault">Assault / Slayer</option>
              <option value="sniper">Sniper / Anchor</option>
              <option value="support">Obj / Support</option>
            </select>
          </div>

          <!-- Cloudflare Turnstile -->
          <div class="cf-turnstile my-4" data-sitekey="YOUR_TURNSTILE_SITE_KEY"></div>

          <button type="submit" class="w-full py-2 bg-[var(--olive)] text-[var(--bone)] font-display hover:bg-[var(--blaze)] transition-colors">
            SUBMIT CREDENTIALS
          </button>
        </form>
      </div>

    </section>
  </main>

  <footer class="relative z-10 border-t border-[var(--line)] py-4 text-center font-mono text-xs text-[var(--muted)]">
    TASK FORCE 141 // POWERED BY CLOUDFLARE WORKERS, D1 & KV
  </footer>

  <!-- Dynamic Cloudflare Endpoint Script -->
  <script>
    const WORKER_BASE_URL = 'https://your-worker.your-subdomain.workers.dev';

    async function loadMetaLoadouts() {
      const container = document.getElementById('loadouts-container');
      try {
        const res = await fetch(`${WORKER_BASE_URL}/api/loadouts`);
        const loadouts = await res.json();
        
        if (!container) return;
        container.innerHTML = loadouts.map(item => `
          <div class="p-4 bg-[var(--panel)] border border-[var(--line)] bracket">
            <div class="bl"></div><div class="br"></div>
            <h4 class="font-display text-lg text-[var(--blaze)]">${item.weapon_name}</h4>
            <p class="text-xs font-mono text-[var(--muted)]">CODE: ${item.share_code}</p>
            <p class="text-sm mt-2 text-[var(--bone)]">${item.attachments.join(' | ')}</p>
            <span class="text-xs text-[var(--ok)] mt-3 block font-mono">▲ ${item.upvotes} Votes</span>
          </div>
        `).join('');
      } catch (err) {
        if (container) {
          container.innerHTML = `<div class="p-4 text-xs font-mono text-[var(--muted)]">CONNECT WORKER ENDPOINT TO FETCH LOADOUTS.</div>`;
        }
      }
    }

    async function loadSchedule() {
      const container = document.getElementById('schedule-container');
      try {
        const res = await fetch(`${WORKER_BASE_URL}/api/matches`);
        const matches = await res.json();
        
        if (!container) return;
        container.innerHTML = matches.map(match => `
          <div class="flex justify-between items-center p-3">
            <div>
              <span class="font-display text-sm text-[var(--bone)]">${match.opponent}</span>
              <span class="text-xs font-mono block text-[var(--muted)]">${new Date(match.timestamp).toLocaleString()}</span>
            </div>
            <button onclick="rsvpMatch('${match.id}')" class="text-xs px-2 py-1 border border-[var(--olive)] hover:bg-[var(--olive)] font-mono">
              RSVP
            </button>
          </div>
        `).join('');
      } catch (err) {
        if (container) {
          container.innerHTML = `<div class="p-3 text-xs font-mono text-[var(--muted)]">CONNECT WORKER ENDPOINT TO FETCH SCHEDULE.</div>`;
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadMetaLoadouts();
      loadSchedule();
    });
  </script>
</body>
</html>
