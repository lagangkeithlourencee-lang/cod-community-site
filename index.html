<!-- Clan Application Section (Hidden by default) -->
<section id="join" class="space-y-4 max-w-xl mx-auto hidden">
  <div class="border-b border-[var(--line)] pb-2 text-center flex justify-between items-center">
    <div>
      <h3 class="font-display text-2xl text-[var(--bone)]">CLAN APPLICATION FORM</h3>
      <p class="text-xs font-mono text-[var(--muted)]">CONNECTED TO CLOUDFLARE WORKERS & D1 DATABASE</p>
    </div>
    <!-- Close button -->
    <button type="button" onclick="toggleApplication()" class="text-xs font-mono text-[var(--muted)] hover:text-[var(--danger)]">
      ✕ CLOSE
    </button>
  </div>
  
  <div class="p-6 bg-[var(--panel)] border border-[var(--line)] bracket">
    <form action="https://your-worker.your-subdomain.workers.dev/api/apply" method="POST" class="space-y-4 text-sm">
      <div>
        <label class="block font-mono text-xs text-[var(--muted)] mb-1">IN-GAME NAME (IGN)</label>
        <input type="text" name="username" placeholder="e.g. Operator_01" required class="w-full bg-[var(--bg)] border border-[var(--line)] p-2.5 text-[var(--bone)] focus:border-[var(--gold)] outline-none font-mono">
      </div>
      
      <div>
        <label class="block font-mono text-xs text-[var(--muted)] mb-1">REGION / CITY</label>
        <input type="text" name="location" placeholder="e.g. Philippines" required class="w-full bg-[var(--bg)] border border-[var(--line)] p-2.5 text-[var(--bone)] focus:border-[var(--gold)] outline-none font-mono">
      </div>

      <div>
        <label class="block font-mono text-xs text-[var(--muted)] mb-1">PRIMARY ROLE</label>
        <select name="role" class="w-full bg-[var(--bg)] border border-[var(--line)] p-2.5 text-[var(--bone)] focus:border-[var(--gold)] outline-none font-mono">
          <option value="assault">Assault / Slayer</option>
          <option value="sniper">Sniper / Anchor</option>
          <option value="support">Objective Player</option>
        </select>
      </div>

      <!-- Cloudflare Turnstile Verification -->
      <div class="cf-turnstile my-4 flex justify-center" data-sitekey="YOUR_TURNSTILE_SITE_KEY"></div>

      <button type="submit" class="w-full py-3 bg-[var(--gold)] text-black font-display font-bold hover:bg-amber-400 transition-colors">
        SUBMIT APPLICATION
      </button>
    </form>
  </div>
</section>
