<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call of Duty Community</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Navigation -->
  <nav class="border-b border-slate-800 bg-slate-900/80 px-6 py-4 flex justify-between items-center">
    <div class="text-xl font-black text-amber-500 tracking-wider">TF141 CLAN</div>
    <div class="space-x-6 text-sm font-semibold">
      <a href="#" class="hover:text-amber-400">Home</a>
      <a href="#" class="hover:text-amber-400">Roster</a>
      <a href="#" class="hover:text-amber-400">Apply</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="flex-1 max-w-4xl mx-auto px-6 py-20 text-center flex flex-col items-center justify-center">
    <span class="bg-amber-500/10 text-amber-400 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/20 uppercase tracking-widest mb-4">
      Recruiting Active Players
    </span>
    <h1 className="text-5xl font-black uppercase text-white tracking-tight">
      Dominate The Battlefield <span class="text-amber-500">With Us</span>
    </h1>
    <p class="mt-4 text-slate-400 max-w-lg">
      Welcome to our Call of Duty community hub. View our active roster, share meta weapon loadouts, and join our squad.
    </p>
    <div class="mt-8 flex gap-4">
      <a href="#" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-6 py-3 rounded-lg font-bold transition">
        Apply To Join
      </a>
    </div>
  </main>
<!-- Clan Join Application Form -->
<section style="max-width: 600px; margin: 40px auto; padding: 20px; font-family: sans-serif; background: #111; color: #fff; border-radius: 8px;">
  <h2>Join Our Call of Duty Clan</h2>
  
  <form id="joinForm">
    <div style="margin-bottom: 15px;">
      <label>Your Name / Gamer Tag:</label><br>
      <input type="text" id="playerName" required style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Activision ID (e.g. Player#12345):</label><br>
      <input type="text" id="activisionId" required style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Discord Username:</label><br>
      <input type="text" id="discordTag" required style="width: 100%; padding: 8px; margin-top: 5px;">
    </div>

    <button type="submit" style="background: #ff5500; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px;">
      Submit Application
    </button>
  </form>

  <p id="responseMessage" style="margin-top: 15px; font-weight: bold;"></p>
</section>
  <script>
  document.getElementById('joinForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const name = document.getElementById('playerName').value;
    const activision = document.getElementById('activisionId').value;
    const discord = document.getElementById('discordTag').value;
    const msg = document.getElementById('responseMessage');

    msg.innerText = "Sending application...";

    // PASTE YOUR DISCORD WEBHOOK URL BELOW INSIDE THE QUOTES
    const webhookUrl = "https://discord.com/api/webhooks/1541399369360613456/oLuyv9hYzvwl4mrvPp0AueiYZt_cXMqXRGahmFAw5GP0-5KNGOYj9ikLaw0E333vVMjB";

    const payload = {
      embeds: [{
        title: "🪖 New COD Clan Application!",
        color: 16733696,
        fields: [
          { name: "Gamer Tag", value: name, inline: true },
          { name: "Activision ID", value: activision, inline: true },
          { name: "Discord Tag", value: discord, inline: true }
        ],
        timestamp: new Date().toISOString()
      }]
    };

    try {
      const res = await fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        msg.style.color = "#00ff00";
        msg.innerText = "Application submitted successfully!";
        document.getElementById('joinForm').reset();
      } else {
        throw new Error();
      }
    } catch (err) {
      msg.style.color = "#ff0000";
      msg.innerText = "Failed to submit. Please try again.";
    }
  });
</script>
</body>
</html>
