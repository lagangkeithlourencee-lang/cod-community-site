<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call of Duty Community</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Navigation -->
  <nav class="border-b border-slate-800 bg-slate-900/80 px-6 py-4 flex justify-between items-center">
    <div class="text-xl font-black text-amber-500 tracking-wider">TF141 CLAN</div>
    <div class="space-x-6 text-sm font-semibold">
      <a href="#" class="hover:text-amber-400">Home</a>
      <a href="#" class="hover:text-amber-400">Roster</a>
      <a href="#" class="hover:text-amber-400">Apply</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="flex-1 max-w-4xl mx-auto px-6 py-20 text-center flex flex-col items-center justify-center">
    <span class="bg-amber-500/10 text-amber-400 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/20 uppercase tracking-widest mb-4">
      Recruiting Active Players
    </span>
    <h1 className="text-5xl font-black uppercase text-white tracking-tight">
      Dominate The Battlefield <span class="text-amber-500">With Us</span>
    </h1>
    <p class="mt-4 text-slate-400 max-w-lg">
      Welcome to our Call of Duty community hub. View our active roster, share meta weapon loadouts, and join our squad.
    </p>
    <div class="mt-8 flex gap-4">
      <a href="#" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-6 py-3 rounded-lg font-bold transition">
        Apply To Join
      </a>
    </div>
  </main>

</body>
</html>
